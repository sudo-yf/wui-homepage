<div class="experience-list">
  {% for item in site.data.experience %}
  <article class="experience-item">
    <div class="experience-mark" aria-hidden="true">
      {% if item.logo %}
      <img src="{{ item.logo | relative_url }}" alt="">
      {% else %}
      <span>{{ item.initials }}</span>
      {% endif %}
    </div>
    <div class="experience-content">
      <div class="experience-heading">
        <div>
          <h3>{{ item.lab }}</h3>
          <p class="experience-institution">{{ item.institution }}</p>
        </div>
        <time>{{ item.period }}</time>
      </div>
      <p class="experience-advisor">Advised by <a href="{{ item.advisor_url }}" target="_blank" rel="noopener">{{ item.advisor }}</a></p>
      {% if item.summary %}
      <p class="experience-summary">{{ item.summary }}</p>
      {% endif %}
    </div>
  </article>
  {% endfor %}
</div>
