<div class="experience-container">
  {% for item in site.data.experience %}
  <article class="experience-card">
    {% if item.logo %}
    <img src="{{ item.logo | relative_url }}" alt="{{ item.institution_name }} logo" class="experience-logo{% if item.logo_variant %} experience-logo--{{ item.logo_variant }}{% endif %}">
    {% endif %}
    <div class="experience-info">
      <strong>{{ item.institution_name }}</strong><br>
      <em>{{ item.period }}</em><br>
      {{ item.lab }} research advised by <a href="{{ item.advisor_url }}" target="_blank" rel="noopener"><em>{{ item.advisor }}</em></a>
      {% if item.summary %}
      <br><span class="experience-summary">{{ item.summary }}</span>
      {% endif %}
    </div>
  </article>
  {% endfor %}
</div>
